<!DOCTYPE html>
<html lang="{{ language|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ message|default:"Hello, World!" }}</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        main {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .meta-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            text-align: left;
        }
        .meta-table th, .meta-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .meta-table th {
            color: #94a3b8;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <main role="main" aria-label="Hello World Greeting Container">
        <h1 id="greeting-header">{{ message }}</h1>
        <p class="subtitle">Bounty Plaza Django Hello World Engine (Issue #1584)</p>
        <table class="meta-table" aria-label="Greeting Metadata">
            <tbody>
                <tr>
                    <th scope="row">Recipient Target</th>
                    <td>{{ target }}</td>
                </tr>
                <tr>
                    <th scope="row">Language Code</th>
                    <td><span class="badge">{{ language }}</span></td>
                </tr>
                <tr>
                    <th scope="row">Base Salutation</th>
                    <td>{{ greeting }}</td>
                </tr>
                <tr>
                    <th scope="row">Punctuation</th>
                    <td>{{ punctuation }}</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
