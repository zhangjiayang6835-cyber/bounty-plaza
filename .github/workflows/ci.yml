name: CI

on:
  push:
    branches: [feat/gemma2-ttnn]
  pull_request:
    branches: [feat/gemma2-ttnn]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt || echo "Optional dependencies failed, continuing with dummy mode"
      - name: Run tests
        run: |
          pytest -q
