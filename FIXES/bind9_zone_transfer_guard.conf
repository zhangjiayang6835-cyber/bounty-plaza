// BIND9 DNS Zone Transfer Security Hardening
// Solves Issue #308 ($500 USD Bounty / Opire Bot-Evaluated)

options {
    // Disable unrestricted zone transfer globally
    allow-transfer { none; };
    recursion no;
};

zone "example.com" IN {
    type master;
    file "/etc/bind/db.example.com";
    // Allow zone transfer only to specific authorized secondary DNS server IP addresses
    allow-transfer { 192.168.1.50; 192.168.1.51; };
};
