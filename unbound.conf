server:
    # Interface to listen on
    interface: 127.0.0.1
    interface: 192.168.1.1
    port: 53

    # Enable DNSSEC validation
    harden-dnssec-stripped: yes
    use-caps-for-id: yes

    # Allow only recursive queries from trusted networks
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow

    # Disable zone transfers (Unbound doesn't support AXFR by default)
    # This is a security measure to prevent zone transfers
    zonefile: ""

    # Split-horizon DNS configuration
    # For internal clients
    view-name: "internal"
    view:
        name: "internal"
        local-zone: "internal.example.com." transparent
        local-data: "internal.example.com. IN A 192.168.1.10"
        local-data: "internal.example.com. IN MX 10 mail.internal.example.com."

    # For external clients
    view-name: "external"
    view:
        name: "external"
        local-zone: "example.com." transparent
        local-data: "example.com. IN A 203.0.113.1"
        local-data: "example.com. IN MX 10 mail.example.com."

    # TSIG configuration for secure communication
    server-key-file: "/etc/unbound/server.key"
    server-cert-file: "/etc/unbound/server.pem"
    remote-control:
        control-enable: yes
        control-interface: 127.0.0.1
        control-port: 8953
        server-key-file: "/etc/unbound/server.key"
        server-cert-file: "/etc/unbound/server.pem"